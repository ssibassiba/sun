<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="일출일몰">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<title>일출·일몰 하늘 그래프</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);--text:#1b2030;--sub:rgba(27,32,48,.62);--card:rgba(255,255,255,.6);--line:rgba(27,32,48,.14);--sheet:rgb(250,250,247)}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:#fff;transition:background .8s}
*{box-sizing:border-box}
html,body{overscroll-behavior:none}
body{margin:0;min-height:calc(100vh - env(safe-area-inset-top,0px));min-height:calc(100dvh - env(safe-area-inset-top,0px));color:var(--text);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;padding:12px 16px 16px;transition:background .8s,color .8s;background:#fff}
.wrap{max-width:560px;margin:0 auto}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;align-items:center;font-size:13px}
.bar[hidden]{display:none}
select,input,button{font:inherit;font-size:14px;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:7px 10px}
input[type=number]{width:110px}
button{cursor:pointer}
.row{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.row select{flex:1;min-width:0;font-size:13px;font-weight:600;padding:7px 4px;height:34px}
.wheel{position:relative;display:flex;justify-content:center;align-items:center;flex:1;min-width:0;height:46px}
.sp{width:1px;height:18px;background:var(--line);flex:none}
.wheel .hl{position:absolute;left:0;right:0;top:11px;height:24px;border-radius:8px;background:var(--card);border:1px solid var(--line);pointer-events:none}
.col{position:relative;z-index:1;height:46px;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none;overscroll-behavior:contain;-webkit-mask-image:linear-gradient(transparent,#000 28%,#000 72%,transparent);mask-image:linear-gradient(transparent,#000 28%,#000 72%,transparent)}
.col::-webkit-scrollbar{display:none}
.col.y{width:62px}.col.n{width:44px}
.col .p{height:11px}
.col .it{height:24px;line-height:24px;text-align:center;scroll-snap-align:center;scroll-snap-stop:always;font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;cursor:pointer;white-space:nowrap}
.hero{position:relative;text-align:center;padding:4px 0 10px}
.dstb{flex:none;font-size:11px;font-weight:600;padding:3px 8px;border-radius:12px}
.dstb[hidden]{display:none}
.dstb{background:#D85A30;border-color:#D85A30;color:#fff}
.dstb.off{background:#1D9E75;border-color:#1D9E75;color:#fff}
.mrow{display:flex;align-items:center;justify-content:space-between;gap:8px}
.mrow .read{margin:6px 2px}
.mtip{position:absolute;z-index:3;pointer-events:none;background:rgba(0,0,0,.8);color:#fff;font-size:12px;padding:4px 8px;border-radius:8px;white-space:nowrap}
.mtip[hidden]{display:none}
.mzl{position:absolute;right:8px;z-index:2;pointer-events:none;font-size:11px;font-weight:700;color:#fff;background:rgba(0,0,0,.45);padding:1px 6px;border-radius:8px}
.mzl[hidden]{display:none}
.hero .lab{font-size:13px;color:var(--sub)}
.hero .big{font-size:clamp(28px,8vw,36px);font-weight:700;letter-spacing:-.5px;margin-top:2px;font-variant-numeric:tabular-nums}
.hero .note{font-size:12px;color:var(--sub);margin-top:2px;min-height:15px;font-variant-numeric:tabular-nums}
.zw{position:relative;overflow:hidden;scrollbar-width:none}
.zw::-webkit-scrollbar{display:none}
.cvo{position:relative;margin-top:4px}
.ax{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:2}
.ax span{position:absolute;font-size:11px;font-weight:600;color:#fff;text-shadow:0 0 3px rgba(0,0,0,.9),0 0 1px #000;white-space:nowrap}
.zw.z #ch text{display:none}
.zw.z{overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
#cvw{aspect-ratio:600/606}
#mapw{aspect-ratio:2/1;border-radius:10px}
.cv{position:relative;aspect-ratio:600/606;width:100%}
#ch,#mapsvg,.cvo,#mapw{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.cv canvas{position:absolute;left:6.667%;top:3.630%;width:91%;height:93.069%;border-radius:4px}
.cv svg{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair;user-select:none}
svg text{font-size:12px;fill:var(--sub);font-family:inherit}
.now{position:absolute;right:0;top:-34px;z-index:4;border:0;border-radius:18px;background:#1b2030;color:#fff;padding:8px 14px;font-weight:600;font-size:13px}
.tip{position:absolute;z-index:3;pointer-events:none;background:rgba(0,0,0,.8);color:#fff;font-size:12px;line-height:1.35;padding:6px 9px;border-radius:8px;white-space:pre}
.tip[hidden]{display:none}
.read{font-size:12px;margin:6px 2px 12px;font-variant-numeric:tabular-nums;white-space:pre-line;line-height:1.45;color:var(--sub)}
#rdo{white-space:pre;height:2.9em;overflow:hidden;letter-spacing:-.2px}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:5;max-width:592px;margin:0 auto;cursor:pointer;padding:2px 16px calc(14px + env(safe-area-inset-bottom,0px));background:var(--sheet);box-shadow:0 -6px 20px rgba(0,0,0,.12);border:1px solid var(--line);border-bottom:0;border-radius:20px 20px 0 0}
.hdl{display:block;width:100%;height:24px;border:0;background:none;padding:0;position:relative;touch-action:none}
.hdl::after{content:"";position:absolute;left:50%;top:9px;width:40px;height:4px;margin-left:-20px;border-radius:2px;background:var(--sub);opacity:.6}
.two{display:grid;grid-template-columns:1fr 1px 1fr;gap:0 12px}
.two .dv{background:var(--line)}
.t{text-align:center}
.t .n{font-size:12px;color:var(--sub)}
.t .v{font-size:26px;font-weight:700;margin:1px 0;font-variant-numeric:tabular-nums}
.t .d{font-size:11px;color:var(--sub)}
.more{display:none;margin-top:12px;max-height:calc(100dvh - 150px);overflow:auto}
.sheet.open .more{display:block}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{border:1px solid var(--line);border-radius:14px;padding:12px}
.moon{grid-column:1/-1;display:flex;gap:14px;align-items:center;text-align:left}
.moon .v{font-size:18px}
.info{margin-top:12px;padding-top:12px;border-top:1px solid var(--line);font-size:13px;line-height:1.5;font-variant-numeric:tabular-nums}
.info .rows{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin:8px 0}
.rw{display:flex;justify-content:space-between;padding:6px 8px;border-radius:8px;font-size:12px}
.rw b{font-variant-numeric:tabular-nums}
.info .cap{font-size:11px;color:var(--sub);display:flex;justify-content:space-between;gap:8px}
.ver{font-size:10px;opacity:.7;flex:none}
.pn{display:block;width:91%;margin:4px 0 0 6.667%;padding:0;border:0;background:none;accent-color:var(--text);height:22px}
.moon .d{flex:1;text-align:left;font-size:12px}
.moon .v{font-size:16px;margin:0}
.mapb{flex:none;padding:0 9px;height:34px;font-size:12px;font-weight:600}
.col.lc{width:54px}.col.ln{width:72px}.col.lt{width:96px}
.col.lc .it,.col.ln .it,.col.lt .it{font-size:13px;overflow:hidden;text-overflow:ellipsis;padding:0 3px}
#lrow select,#lrow .mapb{height:24px;padding:0 6px;border-radius:8px}
.mapsheet{position:relative;overflow:hidden;max-height:0;transition:max-height .35s ease}
.mapsheet.open{max-height:320px;margin-bottom:6px}
.mapsheet svg{display:block;width:100%;height:auto;touch-action:none;border-radius:10px;background:var(--card);border:1px solid var(--line);cursor:crosshair}
</style>
</head>
<body>
<div class="wrap">
  <div class="row" id="lrow"><select id="sc" aria-label="대륙"></select><select id="sn" aria-label="나라"></select><select id="sct" aria-label="도시"></select><button class="mapb" id="mapb">지도</button><button class="mapb" id="gpsb">현위치</button></div>
  <div class="row" id="trow"><div class="wheel" id="wheel"><i class="hl"></i></div><button class="mapb" id="td">지금</button></div>
  <div class="mapsheet" id="mapsheet"><div class="zw" id="mapw"><svg id="mapsvg" viewBox="0 0 360 180"></svg></div><div class="mrow"><div class="read">지도를 누르면 그 좌표로 이동해요. 점을 누르면 그 도시로 이동해요.</div><button class="dstb" id="dstb" hidden></button></div><div class="mtip" id="mtip" hidden></div><div class="mzl" id="mzl" hidden></div><div class="read" id="locnote" hidden></div></div>
  <div class="hero"><div class="lab" id="lab"></div><div class="big" id="cd"></div><div class="note" id="note"></div></div>
  <div class="cvo"><div class="zw" id="cvw"><div class="cv"><canvas id="cv"></canvas><svg id="ch" viewBox="0 0 600 606"></svg><div class="tip" id="tip" hidden></div></div></div><div class="ax" id="ax"></div></div>
  <input type="range" class="pn" id="pn" min="0" max="732" step="1" value="366" aria-label="그래프 좌우 이동">
  <div class="read" id="rdo"></div>
  <div class="sheet" id="sheet">
    <button class="hdl" id="hdl" aria-label="자세히 열기 또는 닫기"></button>
    <div class="two"><div class="t"><div class="n">일출</div><div class="v" id="rv"></div><div class="d" id="rvd"></div></div><i class="dv"></i><div class="t"><div class="n">일몰</div><div class="v" id="sv"></div><div class="d" id="svd"></div></div></div>
    <div class="more">
      <div class="grid">
        <div class="card t"><div class="n" id="avl">현재 태양 고도</div><div class="v" id="av"></div><div class="d" id="avd"></div></div>
        <div class="card t"><div class="n">최고 고도 (그날 하루 중)</div><div class="v" id="nv"></div><div class="d" id="nvd"></div></div>
        <div class="card moon"><svg id="moon" width="44" height="44" viewBox="0 0 56 56"></svg><div class="d" id="mnd"></div><div class="v" id="mnm"></div></div>
      </div>
      <div class="info" id="info"></div>
    </div>
  </div>
  <input type="date" id="dt" hidden>
</div>
<script>
const $=id=>document.getElementById(id),R=Math.PI/180,D=180/Math.PI;
let effMin=0,lat=37.5636,lon=126.9976,tz="Asia/Seoul",name="서울",auto=true,picked=null;
const SPAN=548,N=2*SPAN+1,Wd=365,PX=3;
const dtf={};
let dstOff=false,dstHas=false;const stdC={};
function offAt(z,ms){try{return dstOff&&typeof z==="string"?stdOff(z,ms):offAt0(z,ms)}catch(_){return Math.round(lon/15)*60}}
function stdOff(z,ms){const y=new Date(ms).getUTCFullYear(),k=z+y;return stdC[k]??(stdC[k]=Math.min(offAt0(z,Date.UTC(y,0,1)),offAt0(z,Date.UTC(y,6,1))))}
function hasDST(z){try{if(typeof z!=="string")return false;const y=new Date().getUTCFullYear();return offAt0(z,Date.UTC(y,0,1))!==offAt0(z,Date.UTC(y,6,1))}catch(_){return false}}
function offAt0(z,ms){if(typeof z==="number")return z*60;const f=dtf[z]||(dtf[z]=new Intl.DateTimeFormat("en-US",{timeZone:z,hourCycle:"h23",year:"numeric",month:"numeric",day:"numeric",hour:"numeric",minute:"numeric",second:"numeric"}));const o={};f.formatToParts(new Date(ms)).forEach(p=>o[p.type]=p.value);return (Date.UTC(+o.year,+o.month-1,+o.day,+o.hour,+o.minute,+o.second)-Math.floor(ms/1000)*1000)/6e4}
const kst=()=>new Date(Date.now()+offAt(tz,Date.now())*6e4),todayE=()=>Math.floor(kst().getTime()/864e5);
let startE=0;
let pin=null,viewStart=SPAN-Wd/2,data=[],ext=[],bigC=null,curI=SPAN;
const cache=new Map(),ymemo=new Map();

function ev(y,m,d){
  const jd=Date.UTC(y,m,d,3)/864e5+2440587.5,T=(jd-2451545)/36525;
  const L0=(280.46646+T*(36000.76983+T*0.0003032))%360,M=357.52911+T*(35999.05029-0.0001537*T);
  const e=0.016708634-T*(0.000042037+0.0000001267*T);
  const C=Math.sin(M*R)*(1.914602-T*(0.004817+0.000014*T))+Math.sin(2*M*R)*(0.019993-0.000101*T)+Math.sin(3*M*R)*0.000289;
  const om=125.04-1934.136*T,lam=L0+C-0.00569-0.00478*Math.sin(om*R);
  const e0=23+(26+(21.448-T*(46.815+T*(0.00059-T*0.001813)))/60)/60,eps=e0+0.00256*Math.cos(om*R);
  const dec=Math.asin(Math.sin(eps*R)*Math.sin(lam*R)),yy=Math.tan(eps*R/2)**2;
  const eq=4*D*(yy*Math.sin(2*L0*R)-2*e*Math.sin(M*R)+4*e*yy*Math.sin(M*R)*Math.cos(2*L0*R)-.5*yy*yy*Math.sin(4*L0*R)-1.25*e*e*Math.sin(2*M*R));
  const E=Date.UTC(y,m,d)/864e5,off=offAt(tz,E*864e5+(720-4*lon)*6e4),noon=720-4*lon-eq+off;
  const c=(Math.sin(-0.833*R)-Math.sin(lat*R)*Math.sin(dec))/(Math.cos(lat*R)*Math.cos(dec));
  const h=4*D*Math.acos(Math.max(-1,Math.min(1,c)));
  return {rise:noon-h,set:noon+h,noon,dec,off,sl:lam,pol:c<-1?1:c>1?-1:0,alt:90-Math.abs(lat-dec*D)};
}
function evE(e){let v=cache.get(e);if(!v){const t=new Date(e*864e5);v={...ev(t.getUTCFullYear(),t.getUTCMonth(),t.getUTCDate()),e,y:t.getUTCFullYear(),m:t.getUTCMonth(),d:t.getUTCDate()};cache.set(e,v)}return v}
function tw(v,a){const c=(Math.sin(a*R)-Math.sin(lat*R)*Math.sin(v.dec))/(Math.cos(lat*R)*Math.cos(v.dec));return Math.abs(c)>1?null:4*D*Math.acos(c)}
const altAt=(v,t)=>Math.asin(Math.max(-1,Math.min(1,Math.sin(lat*R)*Math.sin(v.dec)+Math.cos(lat*R)*Math.cos(v.dec)*Math.cos((t-v.noon)/4*R))))*D;
const phaseL=a=>a>=-0.833?"낮":a>=-6?"환한 어스름":a>=-12?"짙은 어스름":a>=-18?"깊은 어스름":"밤";

/* 하늘색: 보라 없이 검푸른 밤 → 강청색 → 주황 → 하늘색 → 흰색 */
const ST=[[-18,[6,11,31]],[-12,[15,29,61]],[-6,[43,74,115]],[-3,[95,135,168]],[0,[242,166,90]],[4,[246,207,148]],[10,[176,208,234]],[28,[226,232,238]]];
function col(a){if(a<=ST[0][0])return ST[0][1];for(let i=1;i<ST.length;i++)if(a<=ST[i][0]){const[a0,c0]=ST[i-1],[a1,c1]=ST[i],f=(a-a0)/(a1-a0);return c0.map((x,j)=>x+(c1[j]-x)*f)}return ST[ST.length-1][1]}
const A0=-20,A1=90,AS=0.1,LUT=[];for(let a=A0;a<=A1+1e-9;a+=AS)LUT.push(...col(a).map(Math.round));

const p2=n=>String(n).padStart(2,"0");
const w24=m=>((m%1440)+1440)%1440;
const hm=m=>{m=w24(Math.round(m));return p2(Math.floor(m/60))+":"+p2(m%60)};
const dur=s=>{s=Math.max(0,Math.round(s));const d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60),c=s%60;return (d?d+"일 ":"")+((d||h)?h+"시간 ":"")+((d||h||m)?p2(m)+"분 ":"")+(d?"":p2(c)+"초")};
const diff=(a,b)=>{const s=Math.round((a-b)*60),x=Math.abs(s);if(!x)return "어제와 같음";return "어제보다 "+Math.floor(x/60)+"분 "+p2(x%60)+"초 "+(s>0?"늦음":"빠름")};
const iso=e=>new Date(e*864e5).toISOString().slice(0,10);
function rel(ms){const d=ms-Date.now(),s=Math.floor(Math.abs(d)/1000);if(s<1)return "지금";const dy=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60),c=s%60;
  return (dy?dy+"일 ":"")+(dy||h?h+"시간 ":"")+m+"분"+(dy?"":" "+c+"초")+(d>0?" 후":" 전")}

/* 달 */
const SYN=29.530588853;
const moonAge=ms=>(((ms/864e5+2440587.5-2451550.1)%SYN)+SYN)%SYN;
const moonName=a=>a<1.85?"삭 (신월)":a<5.54?"초승달":a<9.23?"상현달":a<12.92?"차오르는 달":a<16.61?"보름달":a<20.3?"기우는 달":a<23.99?"하현달":a<27.68?"그믐달":"삭 (신월)";
function moonSVG(p){const q=p<.5?p:1-p,rx=24*Math.abs(Math.cos(2*Math.PI*q)),sw=q<.25?0:1;
  return `<circle cx="28" cy="28" r="24" fill="#2b3350"/><path ${p>=.5?'transform="translate(56 0) scale(-1 1)"':""} d="M28 4A24 24 0 0 1 28 52A${rx.toFixed(2)} 24 0 0 ${sw} 28 4Z" fill="#ffd23f"/>`}

/* 차트 좌표 */
const W=600,H=606,ml=40,mr=14,mt=22,mb=20,plotW=W-ml-mr,plotH=H-mt-mb,ppd=plotW/Wd,PH=plotH*2;
const Yy=m=>mt+plotH*m/1440;
const RISE="#f59f00",SET="#f0386b";
const chEl=$("ch"),cvEl=$("cv");cvEl.width=Wd*PX;cvEl.height=PH;

function paintBig(){
  bigC=document.createElement("canvas");bigC.width=N*PX;bigC.height=PH;
  const g=bigC.getContext("2d"),img=g.createImageData(N*PX,PH),b=img.data,row=N*PX,sl=Math.sin(lat*R),cl=Math.cos(lat*R);
  for(let i=0;i<N;i++){
    const v=data[i],a=sl*Math.sin(v.dec),c=cl*Math.cos(v.dec);
    for(let y=0;y<PH;y++){
      const al=Math.asin(Math.max(-1,Math.min(1,a+c*Math.cos((y/PH*1440-v.noon)/4*R))))*D;
      const k=Math.round((Math.max(A0,Math.min(A1,al))-A0)/AS)*3,o0=y*row+i*PX;
      for(let x=0;x<PX;x++){const o=(o0+x)*4;b[o]=LUT[k];b[o+1]=LUT[k+1];b[o+2]=LUT[k+2];b[o+3]=255}
    }
  }
  g.putImageData(img,0,0);
}
function render(){
  cvEl.getContext("2d").drawImage(bigC,Math.round(viewStart*PX),0,Wd*PX,PH,0,0,Wd*PX,PH);
  $("pn").value=viewStart;const p=$("pan");if(p)p.setAttribute("transform",`translate(${ml-viewStart*ppd} 0)`);if(pin)showTip(-1e4,-1e4);if(typeof axUpd==="function"&&data.length)axUpd();
}
function setView(v){viewStart=Math.max(0,Math.min(N-Wd,v));render()}
const clampI=i=>Math.max(0,Math.min(N-1,i));

function build(){
  cache.clear();ymemo.clear();startE=todayE()-SPAN;$("dt").min=iso(startE);$("dt").max=iso(startE+N-1);
  data=[];for(let i=0;i<N;i++)data.push(evE(startE+i));
  /* 연중 극값 */
  ext=[];
  const y0=data[0].y,y1=data[N-1].y;
  for(let y=y0;y<=y1;y++){
    const e0=Date.UTC(y,0,1)/864e5,e1=Date.UTC(y+1,0,1)/864e5;
    let r0=null,r1=null,s0=null,s1=null;
    for(let e=e0;e<e1;e++){const v=evE(e);if(v.pol)continue;
      if(!r0||v.rise<r0.rise)r0=v;if(!r1||v.rise>r1.rise)r1=v;if(!s0||v.set<s0.set)s0=v;if(!s1||v.set>s1.set)s1=v}
    [[r0,"rise","이른","일출"],[r1,"rise","늦은","일출"],[s0,"set","이른","일몰"],[s1,"set","늦은","일몰"]].forEach(([v,k,kd,nm])=>{
      const i=v.e-startE;if(i>=0&&i<N)ext.push({i,k,val:v[k],text:`연중 가장 ${kd} ${nm}\n${v.y}.${v.m+1}.${v.d} ${hm(v[k])}`})});
  }

  const setTZ=()=>{if(!label&&tzNew&&typeof tz==="number"&&tok===geoTok&&lat===Math.max(-89,Math.min(89,la))){const t=ln.textContent;setLoc({name:nm,lat,lon,tz:tzNew});ln.hidden=false;ln.textContent=t}};
  try{
    const r=await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${la}&longitude=${lo}&localityLanguage=ko`);if(!r.ok||tok!==geoTok){setTZ();return}
    const j=await r.json(),cc=j.countryCode;if(tok!==geoTok)return;
    const names=[j.countryName,j.principalSubdivision,j.city||j.locality].filter((x,i,a)=>x&&a.indexOf(x)===i);
    const oc=oceanName(la,lo);
    ln.textContent=pre+(cc&&names.length?names.join(" · "):j.continentCode==="AN"?"남극":CONT[gc])+` (${nm})`;
    if(!tzNew){const inf=((j.localityInfo||{}).informative||[]).find(x=>/time ?zone/i.test(x.description||"")&&/^[A-Za-z_]+\/[A-Za-z_\/-]+$/.test(x.name||"")&&okTZ(x.name));if(inf)tzNew=inf.name}
    if(near){setTZ();return}
    if(!cc){const ci=j.continentCode==="AN"?CONT.indexOf("남극"):gc;lset(ci,null,null);setTZ();return}
    let rows=DB.filter(x=>(ISO[x[1]]||"").split(" ").includes(cc));
    if(cc==="RU")rows=rows.filter(x=>x[1]===(lo>60?"시베리아":"러시아"));
    if(rows.length){const row=rows[0],ci=CONT.indexOf(row[0]),ni=DB.filter(x=>x[0]===row[0]).indexOf(row);lset(ci,ni,null);
      if(!tzNew){const c=byD.find(b=>rows.includes(DB.filter(x=>x[0]===CONT[b.f.ci])[b.f.ni]));if(c)tzNew=c.f.t[3]}}
    else{const ci=CONT.indexOf(CCN[j.continentCode]);lset(ci>=0?ci:guessCont(la,lo),null,null)}
    setTZ();
  }catch(_){}
}
function setCustom(la,lo,z,label){
  la=Math.max(-89,Math.min(89,la));lo=((lo+540)%360)-180;
  const nm=coordTxt(la,lo);
  $("locnote").hidden=false;$("locnote").textContent=label?`${label} · ${nm}`:nm;
  setLoc({name:nm,lat:la,lon:lo,tz:z==null?Math.round(lo/15):z});
}
/* 지도 시트 */
const MW=360,MH=180,mpx=lo=>(lo+180)/360*MW,mpy=la=>(90-la)/180*MH;let mapLoaded=false,mdn=false,mpos=null;
const loadScript=u=>new Promise((ok,no)=>{const e=document.createElement("script");e.src=u;e.onload=ok;e.onerror=no;document.head.appendChild(e)});
function topoPath(t){
  const T=t.transform,sx=T?T.scale[0]:1,sy=T?T.scale[1]:1,tx=T?T.translate[0]:0,ty=T?T.translate[1]:0;
  const arcs=t.arcs.map(a=>{let x=0,y=0;return a.map(p=>{if(T){x+=p[0];y+=p[1];return [x*sx+tx,y*sy+ty]}return p})});
  const ring=ids=>{let pts=[];ids.forEach(i=>{const a=i<0?arcs[~i].slice().reverse():arcs[i];pts=pts.concat(pts.length?a.slice(1):a)});return pts};
  const rings=[];let d="";const draw=r=>{rings.push(r);let pv=null;r.forEach(p=>{d+=(pv===null||Math.abs(p[0]-pv)>180?"M":"L")+mpx(p[0]).toFixed(1)+" "+mpy(p[1]).toFixed(1);pv=p[0]})};
  Object.values(t.objects).forEach(o=>(o.geometries||[]).forEach(g=>{const ps=g.type==="Polygon"?[g.arcs]:g.type==="MultiPolygon"?g.arcs:[];ps.forEach(p=>p.forEach(r=>draw(ring(r))))}));
  LAND=rings;return d;
}
function buildMap(topo){
  let h="";
  for(let g=-150;g<=180;g+=30)h+=`<line x1="${mpx(g)}" x2="${mpx(g)}" y2="${MH}" stroke="rgba(128,128,128,.18)" vector-effect="non-scaling-stroke"/>`;
  for(let g=-60;g<=60;g+=30)h+=`<line y1="${mpy(g)}" y2="${mpy(g)}" x2="${MW}" stroke="rgba(128,128,128,${g?.18:.4})" vector-effect="non-scaling-stroke"/>`;
  if(topo){try{h+=`<path d="${topoPath(topo)}" fill="rgba(120,130,140,.4)" stroke="rgba(120,130,140,.7)" stroke-width=".6" vector-effect="non-scaling-stroke"/>`}catch(_){}}
  FL.forEach((f,i)=>{h+=`<circle data-i="${i}" cx="${mpx(f.t[2])}" cy="${mpy(f.t[1])}" r="2.4" fill="${f.sp?"#D85A30":"#1D9E75"}" stroke="#fff" stroke-width=".8"/>`});
  h+=`<g id="mk" display="none" style="pointer-events:none"><circle r="5.5" fill="none" stroke="#1b2030" stroke-width="1.6"/><circle r="1.6" fill="#1b2030"/></g>`;
  $("mapsvg").innerHTML=h;mapScale();
}
let mapK=1;
function mapDeclutter(){const w=msv.getBoundingClientRect().width||358,px=w/MW,placed=[],MIN=mapK===1?5:9;
  const order=FL.map((f,i)=>i).sort((a,b)=>(FL[b].tier-FL[a].tier)||a-b);
  order.forEach(i=>{const f=FL[i];f.vis=false;if(mapK===1&&!f.tier)return;const x=mpx(f.t[2])*px,y=mpy(f.t[1])*px;
    if(placed.some(p=>Math.hypot(p[0]-x,p[1]-y)<MIN))return;placed.push([x,y]);f.vis=true})}
function mapScale(){mapDeclutter();msv.querySelectorAll("circle").forEach(c=>{if(c.closest("#mk"))return;if(c.dataset.i!=null)c.style.display=FL[+c.dataset.i].vis?"":"none";c.dataset.r=c.dataset.r||c.getAttribute("r");c.dataset.s=c.dataset.s||c.getAttribute("stroke-width");c.setAttribute("r",(mapK===1?1.9:+c.dataset.r)/mapK);c.setAttribute("stroke-width",c.dataset.s/mapK)});markMap()}
function mshow(lo,la){const m=$("mk");if(m){m.removeAttribute("display");m.setAttribute("transform",`translate(${mpx(lo)} ${mpy(la)}) scale(${1/mapK})`)}}
function markMap(){if($("mk"))mshow(lon,lat)}
/* 해안선: 8배 이상 확대하면 고해상도 */
let mapHi=false;const topoC={};
async function getTopo(k){if(topoC[k])return topoC[k];const r=await fetch(`https://cdn.jsdelivr.net/npm/world-atlas@2/land-${k}.json`);if(!r.ok)throw 0;return topoC[k]=await r.json()}
async function openMap(){
  const o=$("mapsheet").classList.toggle("open");$("mapb").textContent=o?"닫기":"지도";
  if(!o||mapLoaded)return;mapLoaded=true;buildMap(null);
  try{buildMap(await getTopo(mapHi?"50m":"110m"));return}catch(_){}
  try{await loadScript("https://cdnjs.cloudflare.com/ajax/libs/d3/3.5.17/d3.min.js");await loadScript("https://cdnjs.cloudflare.com/ajax/libs/topojson/1.6.9/topojson.min.js");await loadScript("https://cdn.jsdelivr.net/npm/datamaps@0.5.10/dist/datamaps.world.min.js");buildMap(Datamap.prototype.worldTopo)}catch(_){}
}
$("mapb").addEventListener("click",openMap);
document.addEventListener("click",e=>{const m=$("mapsheet");if(!m.classList.contains("open")||m.contains(e.target)||e.target.closest("button,select,input,label,.cvo,#wheel,.sheet,#trow,#lrow"))return;m.classList.remove("open");$("mapb").textContent="지도"},true);
$("gpsb").addEventListener("click",()=>{
  const b=$("gpsb"),fail=()=>{b.textContent="실패";setTimeout(()=>b.textContent="현위치",2500)};
  if(!navigator.geolocation){fail();return}
  b.textContent="찾는 중";
  navigator.geolocation.getCurrentPosition(p=>{let z=null;try{z=Intl.DateTimeFormat().resolvedOptions().timeZone||null}catch(_){}b.textContent="현위치";setCustom(p.coords.latitude,p.coords.longitude,z,"현재 위치");gpsSelects(p.coords.latitude,p.coords.longitude,"현재 위치")},fail,{timeout:10000,maximumAge:6e5});
});
const msv=$("mapsvg"),mloc=e=>{const r=msv.getBoundingClientRect();return [Math.max(-180,Math.min(180,(e.clientX-r.left)/r.width*360-180)),Math.max(-90,Math.min(90,90-(e.clientY-r.top)/r.height*180))]};
function nearDot(x,y,th){const r=msv.getBoundingClientRect();let b=null,bd=th;FL.forEach(f=>{if(!f.vis)return;const d=Math.hypot(r.left+mpx(f.t[2])/MW*r.width-x,r.top+mpy(f.t[1])/MH*r.height-y);if(d<bd){bd=d;b=f}});return b}
function mtipShow(f){const t=$("mtip");if(!f){t.hidden=true;return}const r=msv.getBoundingClientRect(),o=$("mapsheet").getBoundingClientRect(),w=$("mapw").getBoundingClientRect();
  const x=r.left+mpx(f.t[2])/MW*r.width,y=r.top+mpy(f.t[1])/MH*r.height;if(x<w.left||x>w.right||y<w.top||y>w.bottom){t.hidden=true;return}
  t.textContent=`${f.cn} · ${f.t[0]}`;t.hidden=false;const tw=t.offsetWidth;t.style.left=Math.max(0,Math.min(o.width-tw,x-o.left-tw/2))+"px";t.style.top=Math.max(0,y-o.top-30)+"px"}
function mDragAt(x,y){const f=nearDot(x,y,12);if(f){mpos=[f.t[2],f.t[1]]}else mpos=mloc({clientX:x,clientY:y});mshow(mpos[0],mpos[1]);mtipShow(f)}
const mw=$("mapw"),mdb=dbl(),mES=edgeScroll(mw,mDragAt);let mx=0,my=0,mtm=0,mdrag=false;
function mapGo(lo,la){const w=msv.getBoundingClientRect().width/MW;
  const n=FL.filter(f=>f.vis).map(f=>({f,d:Math.hypot((f.t[2]-lo)*MW/360,(f.t[1]-la)*MH/180)*w})).sort((a,b)=>a.d-b.d)[0];
  if(n&&n.d<9)pickCity(n.f.ci,n.f.ni,n.f.ti);else{setCustom(la,lo);gpsSelects(la,lo)}}
msv.addEventListener("pointerdown",e=>{mdn=true;mdrag=false;mx=e.clientX;my=e.clientY;try{msv.setPointerCapture(e.pointerId)}catch(_){}});
msv.addEventListener("pointermove",e=>{if(!mdn)return;if(!mdrag&&Math.hypot(e.clientX-mx,e.clientY-my)>8){mdrag=true;clearTimeout(mtm);mES.start(e.clientX,e.clientY)}
  if(mdrag){mES.move(e.clientX,e.clientY);mDragAt(e.clientX,e.clientY)}});
msv.addEventListener("pointermove",e=>{if(!mdn&&e.pointerType==="mouse")mtipShow(nearDot(e.clientX,e.clientY,14))});
msv.addEventListener("pointerleave",()=>{if(!mdn)mtipShow(null)});
msv.addEventListener("pointercancel",()=>{mdn=false;mES.stop();markMap();mtipShow(null)});
msv.addEventListener("pointerup",e=>{if(!mdn)return;mdn=false;mES.stop();clearTimeout(mtm);if(e.pointerType!=="mouse")mtipShow(null);
  if(mdrag){mapGo(mpos[0],mpos[1]);return}
  if(mdb(e)){zoomToggle(mw,e.clientX,e.clientY);return}
  const[lo,la]=mloc(e);mtm=setTimeout(()=>{mshow(lo,la);mapGo(lo,la)},300)});
$("pn").max=N-Wd;$("pn").addEventListener("input",e=>setView(+e.target.value));
dstUI();build();initWheels();initLWheels();setView(SPAN-Wd/2);tick();padSheet();setInterval(tick,1000);
